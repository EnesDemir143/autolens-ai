name: Keep HF Space Alive

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-space:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPACE_URL: https://huggingface.co/spaces/morpeN1/autolens-ai-demo
    steps:
      - name: Ping Hugging Face Space
        run: |
          status=$(curl --location --output /dev/null --write-out "%{http_code}" "$SPACE_URL")
          echo "Ping status code: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "Space ping failed for $SPACE_URL"
            exit 1
          fi
