# Baseline 1: Light Augmentation
# Requirements: TRN-01, TRN-02, TRN-03, TRN-06, TRN-07
# Phase decision: D-07

# Dataset
data_root: artifacts/dataset/raw
train_csv: artifacts/dataset/splits/train.csv
val_csv: artifacts/dataset/splits/val.csv
test_csv: artifacts/dataset/splits/internal_test.csv

# Preprocessing (Baseline 1: light augmentation)
resize_size: 256
crop_size: 224
use_augmentation: true

# Model
model_name: resnet18
num_classes: 8
pretrained: true

# Training
batch_size: 32
num_workers: 4
max_epochs: 50
learning_rate: 0.001
weight_decay: 0.0001

# Class imbalance handling (same as Baseline 0)
use_weighted_sampler: false
use_class_weights: true
max_class_weight: 5.0

# Callbacks
early_stopping_patience: 10
monitor_metric: val/loss
monitor_mode: min

# Device
accelerator: null

# Checkpoints
checkpoint_dir: checkpoints/baseline_1_resnet18_augmented

# Experiment tracking
experiment_name: baseline_1_light_augmentation
tags:
  - baseline_1
  - light_augmentation
  - class_weighted_loss
  - resnet18
